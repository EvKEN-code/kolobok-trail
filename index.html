<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Тропинка Колобка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marmelad&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: the 3D forest fills the whole screen. A floating top bar holds menu, progress, stars and sound. The speech bubble and task live in a side panel (bottom sheet on phones). Single sunny-day look by choice. */
:root {
  --font-display: 'Marmelad', 'Nunito', system-ui, sans-serif;
  --font-body: 'Nunito', system-ui, sans-serif;
  --bg: #bfe6ff;
  --surface: #ffffff;
  --panel: rgb(255 255 255 / .95);
  --glass: rgb(255 255 255 / .93);
  --ink: #22314a;
  --muted: #586986;
  --line: #cfe1f5;
  --star: #ffb300;
  --star-empty: #d6e0ef;
  --ok: #1fa35a;
  --on-ok: #ffffff;
  --bad: #e0455b;
  --berry: #e5483a;
  --on-berry: #ffffff;
  --shape-edge: rgb(0 0 0 / .22);
  --shadow: 0 10px 30px rgb(36 80 130 / .28);
  --shadow-sm: 0 4px 14px rgb(36 80 130 / .25);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 1.05rem;
  -webkit-tap-highlight-color: transparent;
}
h1 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; font-size: clamp(1.9rem, 6vw, 2.6rem); line-height: 1.1; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 4px solid var(--star); outline-offset: 3px; }
svg { display: block; }

#view3d {
  position: fixed; inset: 0; z-index: 0; touch-action: manipulation;
  background: linear-gradient(#4aa8f2 0%, #a9dcff 55%, #fff1c2 100%);
}
#view3d canvas { display: block; width: 100%; height: 100%; }

#hud {
  position: fixed; z-index: 5; left: 16px; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 10px);
  display: flex; align-items: center; gap: 8px; pointer-events: none;
}
#hud > * { pointer-events: auto; }
.hud-mid { flex: 1; min-width: 0; display: flex; justify-content: center; pointer-events: none; }
.hud-mid > * { pointer-events: auto; }
#hud .ghost, #hud .pill, .hud-mid .dots { border-color: #fff; box-shadow: var(--shadow-sm); }
.hud-mid .dots { background: var(--glass); padding: 11px 16px; border: 2px solid #fff; border-radius: 999px; }

#body {
  position: fixed; z-index: 4; display: flex; flex-direction: column; gap: 12px; min-width: 0;
  background: var(--panel); border: 3px solid #fff; box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  overflow-y: auto; overscroll-behavior: contain; padding: 16px;
}
#body > * { flex-shrink: 0; }
@media (min-width: 860px) {
  #body {
    top: calc(env(safe-area-inset-top, 0px) + 74px); right: 16px;
    width: clamp(340px, 34vw, 440px); max-height: calc(100% - 96px - env(safe-area-inset-top, 0px));
    border-radius: 28px;
  }
}
@media (max-width: 859px) {
  #body {
    left: 0; right: 0; bottom: 0; max-height: 66%;
    border-radius: 28px 28px 0 0; border-bottom: 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  }
  .say .lbl2 { display: none; }
}

.pill {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 10px; min-height: 44px;
  background: var(--glass); border: 2px solid var(--line); border-radius: 999px;
  font-family: var(--font-display); font-variant-numeric: tabular-nums; font-size: 1.15rem;
}
.pill svg { width: 24px; height: 24px; }
.pill.pulse { animation: pop .5s ease; }
.ghost {
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; min-height: 44px;
  background: var(--glass); border: 2px solid var(--line); border-radius: 14px;
}
.ghost svg { width: 22px; height: 22px; }
.lead { color: var(--muted); font-size: 1.1rem; line-height: 1.45; }
.dots { display: flex; justify-content: center; gap: 10px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--star-empty); }
.dots i.done { background: var(--ok); }
.dots i.now { background: var(--star); transform: scale(1.35); }
.small-cap { text-align: center; color: var(--muted); font-size: .95rem; }

.center { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.btn {
  min-height: 60px; padding: 12px 30px; border: 0; border-radius: 22px;
  font-family: var(--font-display); font-size: 1.3rem;
  background: var(--berry); color: var(--on-berry); box-shadow: 0 5px 0 rgb(0 0 0 / .25);
}
.btn.alt { background: var(--surface); color: var(--ink); border: 3px solid var(--line); box-shadow: 0 5px 0 var(--line); }
.btn:active { transform: translateY(3px); }
.actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.caption { text-align: center; font-family: var(--font-display); font-size: 1.3rem; color: var(--muted); padding-block: 6px; }
.score { font-family: var(--font-display); font-size: 2.2rem; display: inline-flex; align-items: center; gap: 10px; }
.score svg { width: 42px; height: 42px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--surface); border: 2px solid var(--line); border-radius: 999px; }
.chip .em { font-size: 1.5rem; line-height: 1; }

.scene { display: flex; align-items: flex-start; gap: 10px; }
.char { font-size: 3rem; line-height: 1; flex: none; }
.bubble {
  position: relative; flex: 1; min-width: 0; background: var(--surface); border: 3px solid var(--line);
  border-radius: 22px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;
}
.bubble::before {
  content: ''; position: absolute; left: -13px; top: 22px; width: 18px; height: 18px; background: var(--surface);
  border-left: 3px solid var(--line); border-bottom: 3px solid var(--line); transform: rotate(45deg);
}
.who-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.who { font-family: var(--font-display); color: var(--berry); font-size: 1.1rem; }
.meta { color: var(--muted); font-size: .9rem; }
.line { line-height: 1.35; }
.task { font-family: var(--font-display); font-size: 1.3rem; line-height: 1.25; }
.say { align-self: flex-start; }

.stage {
  background: #f4faff; border: 2px solid var(--line); border-radius: 24px;
  padding: 12px 10px; min-height: 140px; display: flex; align-items: center; justify-content: center; text-align: center;
}
.items { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 8px; }
.item {
  font-size: 2.7rem; line-height: 1.15; border: 3px solid transparent; border-radius: 18px; background: none; padding: 2px 6px;
  transition: transform .15s ease, opacity .15s ease;
}
.items.many .item { font-size: 2.2rem; }
.item.mark { opacity: .35; transform: scale(.85); border-color: var(--line); }
.word { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.word .pic { font-size: 4.2rem; line-height: 1; }
.word .txt { font-family: var(--font-display); font-size: 2rem; display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; }
.seq, .eq { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 12px; }
.seq span { font-size: 2.4rem; line-height: 1; }
.seq .num, .num { font-family: var(--font-display); font-size: 2.6rem; }
.eq b { font-family: var(--font-display); font-weight: 400; font-size: 2.1rem; }
.grp { font-size: 1.7rem; line-height: 1.15; max-width: 9.5em; word-break: break-all; }
.slot {
  display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px;
  border: 4px dashed var(--muted); border-radius: 18px; color: var(--muted); font-family: var(--font-display); font-size: 2rem;
}
.slot.filled { border-style: solid; border-color: var(--ok); color: var(--ink); }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
.cmp .box { border: 3px dashed var(--line); border-radius: 18px; padding: 8px; font-size: 1.7rem; line-height: 1.2; display: flex; flex-direction: column; gap: 4px; align-items: center; word-break: break-all; background: var(--surface); }

.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.opts.n4 { grid-template-columns: repeat(4, 1fr); gap: 8px; }
.opts.locked { opacity: .45; }
.opt {
  min-height: 84px; font-family: var(--font-display); font-size: 2.4rem; line-height: 1; padding: 6px;
  background: var(--surface); border: 3px solid var(--line); border-radius: 22px; box-shadow: 0 5px 0 var(--line);
  display: flex; align-items: center; justify-content: center;
  transition: transform .1s ease, box-shadow .1s ease;
}
.opts.n4 .opt { font-size: 2rem; }
.opts.small .opt { font-size: 1.5rem; }
.opt svg { width: 50px; height: 50px; }
.opt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.opt.right { background: var(--ok); border-color: var(--ok); color: var(--on-ok); box-shadow: 0 5px 0 rgb(0 0 0 / .2); }
.opt.wrong { border-color: var(--bad); opacity: .55; animation: shake .35s ease; }
.opt:disabled { cursor: default; }
.fb { min-height: 1.7rem; text-align: center; font-family: var(--font-display); font-size: 1.25rem; color: var(--muted); }
.fb.good { color: var(--ok); }
.fb.try { color: var(--bad); }

.cards { display: grid; gap: 10px; }
.card {
  position: relative; aspect-ratio: 1.1; border: 0; border-radius: 18px; padding: 0;
  background: var(--berry); color: var(--on-berry); box-shadow: 0 4px 0 rgb(0 0 0 / .25);
  font-size: clamp(1.8rem, 6vw, 2.8rem); line-height: 1;
}
.card .back { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: .85; }
.card .face {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: var(--surface); border: 3px solid var(--line); border-radius: 18px; opacity: 0; transform: scale(.7);
  transition: opacity .18s ease, transform .18s ease;
}
.card.open .face, .card.done .face { opacity: 1; transform: scale(1); }
.card.done .face { border-color: var(--ok); }

@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

@media (max-width: 859px) {
  .char { font-size: 2.4rem; }
  .bubble { padding: 10px 12px; gap: 6px; }
  .line { font-size: .98rem; }
  .task { font-size: 1.15rem; }
  .stage { min-height: 80px; padding: 6px; }
  .say { min-height: 40px; padding: 6px 12px; }
  .opt { min-height: 60px; }
  .item { font-size: 2.1rem; }
  .items.many .item { font-size: 1.8rem; }
  .word .pic { font-size: 3rem; }
  .word .txt { font-size: 1.5rem; }
  .seq span { font-size: 1.9rem; }
  .seq .num, .num { font-size: 2.1rem; }
  .eq b { font-size: 1.7rem; }
  .grp { font-size: 1.35rem; }
  .slot { width: 46px; height: 46px; font-size: 1.6rem; }
  .cmp .box { font-size: 1.35rem; }
  .opt { min-height: 66px; font-size: 2rem; }
  .opts.n4 .opt { font-size: 1.7rem; }
  .opt svg { width: 42px; height: 42px; }
  .fb { min-height: 1.4rem; font-size: 1.1rem; }
  #body { gap: 10px; }
}
@media (max-width: 560px) {
  .lbl { display: none; }
  #hud { gap: 6px; }
  .hud-mid .dots { padding: 12px 12px; gap: 6px; }
  .dots i { width: 12px; height: 12px; }
}
</style>

</head>
<body>
<div id="wrap">
  <div id="view3d" aria-hidden="true"></div>
  <div id="hud"></div>
  <div id="body"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var hudEl = document.getElementById('hud');
  var bodyEl = document.getElementById('body');
  var wrapEl = document.getElementById('wrap');

  /* ================= storage, sound, speech ================= */
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  var stars = store.get('kl_stars', 0);
  var sound = store.get('kl_sound', true);
  var ac;
  function tone(freq, t0, dur, type, vol) {
    if (!sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      o.connect(g); g.connect(ac.destination);
      var t = ac.currentTime + t0;
      g.gain.setValueAtTime(vol || 0.15, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  }
  var sfx = {
    ok: function () { tone(660, 0, 0.15); tone(880, 0.12, 0.25); },
    bad: function () { tone(200, 0, 0.22, 'triangle'); },
    flip: function () { tone(520, 0, 0.08, 'triangle', 0.1); },
    roll: function () { [330, 392, 440, 523, 587, 659].forEach(function (f, i) { tone(f, i * 0.4, 0.2, 'triangle', 0.07); }); },
    win: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * 0.12, 0.3); }); }
  };
  function say(text) {
    if (!sound || !('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ru-RU'; u.rate = 0.9;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function hush() { try { speechSynthesis.cancel(); } catch (e) {} }

  /* ---- calm background music, synthesized in the browser (no audio files) ---- */
  var music = (function () {
    var on = store.get('kl_music', true);
    var run = null;
    var BEAT = 0.85, EIGHTH = BEAT / 2;
    var CH = [
      { pad: [196.0, 261.63, 329.63], bass: 130.81, mel: [329.63, 392.0, 523.25, 587.33, 440.0] },
      { pad: [220.0, 261.63, 329.63], bass: 110.0, mel: [440.0, 523.25, 659.25, 587.33, 392.0] },
      { pad: [220.0, 261.63, 349.23], bass: 87.31, mel: [440.0, 523.25, 587.33, 392.0, 659.25] },
      { pad: [196.0, 246.94, 293.66], bass: 98.0, mel: [587.33, 392.0, 440.0, 659.25, 783.99] }
    ];
    function getAC() {
      try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); return ac; } catch (e) { return null; }
    }
    function voice(r, type, freq, t, dur, vol, atk, wet, det) {
      var A = ac, o = A.createOscillator(), g = A.createGain();
      o.type = type; o.frequency.value = freq;
      if (det) o.detune.value = det;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + atk);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(r.master);
      if (wet) g.connect(r.delay);
      o.start(t); o.stop(t + dur + 0.1);
    }
    function tick(r) {
      var A = ac;
      while (r.next < A.currentTime + 0.9) {
        var s = r.step % 64, ch = CH[Math.floor(s / 16)], e = s % 16, t = r.next;
        if (e === 0) {
          ch.pad.forEach(function (f) {
            voice(r, 'sine', f, t, BEAT * 8 + 2.2, 0.03, 2.0, false, -6);
            voice(r, 'sine', f, t, BEAT * 8 + 2.2, 0.022, 2.0, false, 7);
          });
        }
        if (e === 0 || e === 8) voice(r, 'sine', ch.bass, t, BEAT * 3, e === 0 ? 0.07 : 0.045, 0.06, false);
        if (e % 2 === 0 ? Math.random() < 0.6 : Math.random() < 0.22) {
          var f = ch.mel[rnd(ch.mel.length)];
          if (f === r.last) f = ch.mel[rnd(ch.mel.length)];
          r.last = f;
          if (Math.random() < 0.15) f *= 2;
          voice(r, 'sine', f, t, 1.8, 0.07, 0.012, true);
          voice(r, 'triangle', f * 2, t, 0.7, 0.012, 0.01, true);
        }
        r.next += EIGHTH; r.step++;
      }
    }
    function start() {
      if (run || !on) return;
      var A = getAC(); if (!A) return;
      try { if (A.state === 'suspended') A.resume(); } catch (e) {}
      var master = A.createGain(), delay = A.createDelay(1.0), fb = A.createGain(), lp = A.createBiquadFilter(), wet = A.createGain();
      master.gain.setValueAtTime(0.0001, A.currentTime);
      master.gain.linearRampToValueAtTime(0.75, A.currentTime + 3);
      delay.delayTime.value = EIGHTH * 1.5; fb.gain.value = 0.32; lp.type = 'lowpass'; lp.frequency.value = 1800; wet.gain.value = 0.45;
      delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(wet); wet.connect(master);
      master.connect(A.destination);
      var r = { master: master, delay: delay, next: A.currentTime + 0.25, step: 0, last: 0, timer: null };
      r.timer = setInterval(function () { tick(r); }, 150);
      run = r;
      tick(r);
    }
    function stop() {
      if (!run) return;
      var r = run; run = null;
      clearInterval(r.timer);
      try {
        r.master.gain.cancelScheduledValues(ac.currentTime);
        r.master.gain.setValueAtTime(r.master.gain.value, ac.currentTime);
        r.master.gain.linearRampToValueAtTime(0.0001, ac.currentTime + 0.6);
      } catch (e) {}
      setTimeout(function () { try { r.master.disconnect(); } catch (e) {} }, 900);
    }
    document.addEventListener('visibilitychange', function () {
      if (!ac) return;
      try { if (document.hidden) ac.suspend(); else if (on) ac.resume(); } catch (e) {}
    });
    return {
      isOn: function () { return on; },
      kick: function () { start(); },
      toggle: function () { on = !on; store.set('kl_music', on); if (on) start(); else stop(); return on; }
    };
  })();
  ['pointerup', 'keydown'].forEach(function (ev) { document.addEventListener(ev, function () { music.kick(); }); });

  /* ================= helpers ================= */
  function rnd(n) { return Math.floor(Math.random() * n); }
  function pick(a) { return a[rnd(a.length)]; }
  function shuffle(a) {
    var r = a.slice();
    for (var i = r.length - 1; i > 0; i--) { var j = rnd(i + 1); var t = r[i]; r[i] = r[j]; r[j] = t; }
    return r;
  }
  function rep(s, n) { var r = ''; for (var i = 0; i < n; i++) r += s; return r; }
  var PRAISE = ['Верно!', 'Молодец!', 'Отлично!', 'Здорово!', 'Умница!'];

  var STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--star)" stroke="rgb(0 0 0 / .18)" stroke-width="1" d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg>';
  var ICON = {
    back: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></svg>',
    speaker: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9z"/><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M16 8.5a5 5 0 010 7M18.8 6a8.5 8.5 0 010 12"/></svg>',
    mute: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9z"/><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M16 9l5 6M21 9l-5 6"/></svg>',
    note: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10 3v11.3a3.7 3.7 0 1 0 2.2 3.4V8h6V3z"/></svg>',
    noteOff: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10 3v11.3a3.7 3.7 0 1 0 2.2 3.4V8h6V3z" opacity=".55"/><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" d="M3.5 3.5l17 17"/></svg>'
  };

  /* ================= 3D world ================= */
  var World = (function () {
    var noop = {
      setMode: function () {}, cheer: function () {}, complete: function () {}, reset: function () {},
      travel: function (i, ms, cb) { setTimeout(cb, Math.min(ms, 1200)); }
    };
    if (typeof THREE === 'undefined') return noop;
    var host = document.getElementById('view3d');
    var renderer;
    try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
    catch (e) { return noop; }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    host.appendChild(renderer.domElement);

    var scene = new THREE.Scene();
    var HAZE = 0xd9f2ff;
    scene.fog = new THREE.Fog(HAZE, 26, 100);

    World.setMode('follow');
    sfx.roll();
    World.travel(q + 1, 3600, function () {
      if (S !== sess) return;
      World.setMode('talk', q + 1);
      task();
    });
  }

  function goHome() {
    var sess = S;
    show(hudHTML(true, -1), '<p class="caption">Колобок почти у бабушки…</p>');
    hush();
    World.setMode('follow');
    sfx.roll();
    World.travel(QUESTS.length + 1, 3600, function () { if (S === sess) finale(); });
  }

  function sceneHTML(qd, meta, line, prompt) {
    return '<div class="scene"><div class="char" aria-hidden="true">' + qd.who + '</div>' +
      '<div class="bubble"><div class="who-row"><b class="who">' + qd.name + '</b><span class="meta">' + meta + '</span></div>' +
      (line ? '<p class="line">' + line + '</p>' : '') +
      '<p class="task" id="task">' + prompt + '</p>' +
      '<button class="ghost say" type="button" data-act="say">' + ICON.speaker + '<span>Послушать</span></button></div></div>';
  }

  function solved(sess, firstTry) {
    if (firstTry) { sess.earned++; sess.per[sess.q]++; addStar(); }
    World.cheer(sess.q + 1);
    setTimeout(function () {
      if (S !== sess) return;
      if (sess.t < 4) { sess.t++; task(); return; }
      World.complete(sess.q + 1);
      if (sess.q < QUESTS.length - 1) { sess.q++; sess.t = 0; goTo(sess.q); }
      else goHome();
    }, 1600);
  }

  function task() {
    var sess = S, qd = QUESTS[S.q], spec = qd.tasks[S.t];
    S.miss = false; S.tk++;
    var tk = S.tk;
    var line = S.t === 0 ? qd.intro : LINES[S.t];
    var meta = qd.topic + ' · встреча ' + (S.q + 1) + ' из ' + QUESTS.length;
    var hud = hudHTML(true, S.t);
    if (spec.t === 'pairs') return taskPairs(sess, qd, spec, line, hud, meta);

    var r = TASKS[spec.t](spec);
    sess.say = (line ? line + ' ' : '') + r.prompt;
    var optsHTML = '<div class="opts ' + (r.optClass || '') + (r.delayed ? ' locked' : '') + '" id="opts">' + r.options.map(function (o) {
      return '<button class="opt" type="button" data-v="' + o.v + '"' + (r.delayed ? ' disabled' : '') + '>' + o.label + '</button>';
    }).join('') + '</div>';
    show(hud,
      sceneHTML(qd, meta, line, r.prompt) +
      (r.stage ? '<div class="stage" id="stage">' + r.stage + '</div>' : '') +
      '<p class="fb" id="fb" role="status" aria-live="polite">' + (r.delayed ? 'Запоминай…' : (r.note || '')) + '</p>' + optsHTML);
    say(sess.say);

    var fb = document.getElementById('fb'), box = document.getElementById('opts');
    var opts = [].slice.call(box.querySelectorAll('.opt'));
    if (r.delayed) {
      setTimeout(function () {
        if (S !== sess || sess.tk !== tk) return;
        var st = document.getElementById('stage'), tt = document.getElementById('task');
        if (st) st.innerHTML = r.delayed.stage;
        if (tt) tt.textContent = r.delayed.prompt;
        sess.say = r.delayed.prompt;
        fb.textContent = '';
        box.classList.remove('locked');
        opts.forEach(function (x) { x.disabled = false; });
        say(r.delayed.prompt);
      }, r.delayed.ms);
    }
    box.addEventListener('click', function (ev) {
      var b = ev.target.closest('.opt');
      if (!b || b.disabled || S !== sess || sess.tk !== tk) return;
      if (b.getAttribute('data-v') === String(r.answer)) {
        sfx.ok();
        b.classList.add('right');
        opts.forEach(function (x) { x.disabled = true; });
        if (r.fillSlot) { var sl = document.getElementById('slot'); if (sl) { sl.textContent = r.answer; sl.classList.add('filled'); } }
        var p = pick(PRAISE);
        fb.textContent = p; fb.className = 'fb good';
        say(p);
        solved(sess, !sess.miss);
      } else {
        sfx.bad();
        sess.miss = true;
        b.classList.add('wrong'); b.disabled = true;
        fb.textContent = 'Подумай ещё!'; fb.className = 'fb try';
      }
    });
    var items = bodyEl.querySelector('.items');
    if (items) items.addEventListener('click', function (ev) {
      var it = ev.target.closest('.item');
      if (it) { it.classList.toggle('mark'); sfx.flip(); }
    });
  }

  function taskPairs(sess, qd, spec, line, hud, meta) {
    var prompt = 'Найди одинаковые картинки.';
    var picks = shuffle(MEM).slice(0, spec.pairs), deck = shuffle(picks.concat(picks));
    var open = [], lock = false, found = 0, tk = sess.tk;
    sess.say = (line ? line + ' ' : '') + prompt;
    show(hud,
      sceneHTML(qd, meta, line, prompt) +
      '<p class="fb" id="fb" role="status" aria-live="polite">Найдено пар: 0 из ' + spec.pairs + '</p>' +
      '<div class="cards" style="grid-template-columns:repeat(' + (spec.pairs === 3 ? 3 : 4) + ',1fr)">' + deck.map(function (e, i) {
        return '<button class="card" type="button" data-i="' + i + '" aria-label="Карточка"><span class="back">★</span><span class="face">' + e + '</span></button>';
      }).join('') + '</div>');
    say(sess.say);
    var fb = document.getElementById('fb');
    bodyEl.querySelector('.cards').addEventListener('click', function (ev) {
      var c = ev.target.closest('.card');
      if (!c || lock || S !== sess || sess.tk !== tk || c.classList.contains('open') || c.classList.contains('done')) return;
      c.classList.add('open'); sfx.flip();
      open.push(c);
      if (open.length < 2) return;
      var a = open[0], b = open[1];
      var same = deck[+a.getAttribute('data-i')] === deck[+b.getAttribute('data-i')];
      open = [];
      if (same) {
        found++;
        a.classList.replace('open', 'done'); b.classList.replace('open', 'done');
        sfx.ok();
        fb.textContent = 'Найдено пар: ' + found + ' из ' + spec.pairs;
        if (found === spec.pairs) {
          var p = pick(PRAISE);
          fb.textContent = p + ' Все пары найдены!'; fb.className = 'fb good';
          say(p);
          solved(sess, true);
        }
      } else {
        lock = true;
        setTimeout(function () { a.classList.remove('open'); b.classList.remove('open'); lock = false; }, 850);
      }
    });
  }

  function finale() {
    var sess = S;
    World.setMode('orbit', 0, true);
    var chips = QUESTS.map(function (qd, i) {
      return '<span class="chip"><span class="em" aria-hidden="true">' + qd.who + '</span>' + qd.name + ': ' + sess.per[i] + ' из 5</span>';
    }).join('');
    show(hudHTML(false, -1),
      '<section class="center"><h1>Колобок дошёл до бабушки!</h1>' +
      '<div class="score" aria-label="Звёзд за первую попытку">' + STAR + sess.earned + ' из ' + QUESTS.length * 5 + '</div>' +
      '<p class="lead">Ты помог всем друзьям в лесу.</p>' +
      '<div class="chips">' + chips + '</div>' +
      '<div class="actions"><button class="btn" type="button" data-act="begin">Пройти ещё раз</button>' +
      '<button class="btn alt" type="button" data-act="home">В начало</button></div></section>');
    sfx.win();
    say('Колобок дошёл до бабушки! Ты настоящий молодец!');
  }

  /* ================= clicks ================= */
  wrapEl.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');
    if (act === 'begin') begin();
    else if (act === 'home') showStart();
    else if (act === 'say' && S) say(S.say);
    else if (act === 'music') {
      music.toggle();
      t.outerHTML = musicBtn();
    }
    else if (act === 'sound') {
      sound = !sound; store.set('kl_sound', sound);
      if (!sound) hush();
      t.outerHTML = soundBtn();
    }
  });

  showStart();
})();
</script>
</body>
</html>
